<div class="iface-row">
    <span class="iface-label">Speed</span>
    <span class="iface-value">
        {% if data.speed %}
            {% with s=data.speed %}
                {% with num=s|cut:"Mb/s"|cut:"MBit/s"|cut:" " %}
                    {% if num|floatformat:0 >= 500 %}
                        <span class="speed-good">{{ data.speed }}</span>
                    {% elif num|floatformat:0 >= 100 %}
                        <span class="speed-ok">{{ data.speed }}</span>
                    {% else %}
                        <span class="speed-bad">{{ data.speed }}</span>
                    {% endif %}
                {% endwith %}
            {% endwith %}
        {% else %}
            —
        {% endif %}
    </span>
</div>
