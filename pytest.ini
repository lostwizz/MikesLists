[pytest]
DJANGO_SETTINGS_MODULE = settings.dev
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests *TestCase
python_functions = test_*

# Look for tests in all these directories
testpaths =
    app_accounts/tests
    app_core/tests
    app_ToDo/tests
    tests
    tests_pytest

pythonpath = .

filterwarnings =
    ignore:Overriding setting DATABASES can lead to unexpected behavior.:UserWarning

addopts =
    --disable-warnings
    --strict-markers
    --tb=short

# Logging (only enable when debugging)
# log_cli = true
# log_cli_level = DEBUG
# log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
# log_cli_date_format=%Y-%m-%d %H:%M:%S
